<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <title>Gastos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    .app {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 22px;
    }

    h1 {
      font-size: 38px;
      margin: 18px 0 22px;
    }

    .tarjeta {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .titulo-total {
      color: #777;
      font-size: 18px;
    }

    #total {
      margin: 8px 0 0;
      font-size: 38px;
    }

    input,
    select {
      display: block;
      width: 100%;
      min-height: 58px;
      margin-bottom: 13px;
      padding: 0 15px;

      border: 1px solid #d8d8d8;
      border-radius: 12px;

      background: white;
      color: #222;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 17px;
    }

    #monto {
      font-size: 25px;
      font-weight: bold;
    }

    input[type="date"] {
      min-height: 58px;
      color: #222;
      background: white;
    }

    button {
      width: 100%;
      min-height: 58px;

      border: 0;
      border-radius: 12px;

      padding: 14px;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;
    }

    #guardar {
      background: #222;
      color: white;
    }

    #guardar:disabled {
      opacity: 0.5;
    }

    .imprimir {
      background: #666;
      color: white;
      margin-bottom: 28px;
    }

    .estado {
      min-height: 22px;
      margin: 5px 0 15px;

      text-align: center;
      font-size: 15px;
      color: #666;
    }

    .estado.ok {
      color: #15803d;
      font-weight: bold;
    }

    .estado.error {
      color: #b00020;
      font-weight: bold;
    }

    h2.seccion {
      font-size: 26px;
      margin: 10px 0 16px;
    }

    .gasto {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      gap: 15px;

      background: white;

      border-radius: 13px;

      padding: 16px;
      margin-bottom: 9px;
    }

    .categoria {
      font-size: 17px;
      font-weight: bold;
    }

    .detalle {
      margin-top: 4px;
      font-size: 15px;
    }

    .info {
      margin-top: 6px;

      color: #777;
      font-size: 14px;
    }

    .importe {
      white-space: nowrap;

      font-size: 18px;
      font-weight: bold;
    }

    .vacio {
      text-align: center;
      color: #888;

      padding: 30px 10px;
    }

    @media print {

      body {
        background: white;
      }

      .formulario,
      .imprimir,
      .estado {
        display: none !important;
      }

      .app {
        max-width: 100%;
        padding: 0;
      }

      .gasto,
      .tarjeta {
        border: 1px solid #ddd;
      }

      .gasto {
        break-inside: avoid;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Gastos</h1>


  <div class="tarjeta">

    <div class="titulo-total">
      Gastado este mes
    </div>

    <h2 id="total">
      $0
    </h2>

  </div>


  <div class="tarjeta formulario">

    <input
      id="monto"
      type="number"
      inputmode="decimal"
      min="0"
      step="0.01"
      placeholder="$ Monto"
    >


    <input
      id="fecha"
      type="date"
    >


    <select id="categoria">

      <option value="Supermercado">
        Supermercado
      </option>

      <option value="Comida">
        Comida
      </option>

      <option value="Combustible">
        Combustible
      </option>

      <option value="Chicos">
        Chicos
      </option>

      <option value="Salidas">
        Salidas
      </option>

      <option value="Compras">
        Compras
      </option>

      <option value="Casa">
        Casa
      </option>

      <option value="Otros">
        Otros
      </option>

    </select>


    <input
      id="detalle"
      type="text"
      placeholder="Detalle (opcional)"
    >


    <select id="persona">

      <option value="Nico">
        Nico
      </option>

      <option value="Mica">
        Mica
      </option>

    </select>


    <button
      id="guardar"
      type="button"
    >
      Guardar gasto
    </button>

  </div>


  <div
    id="estado"
    class="estado"
  ></div>


  <button
    type="button"
    class="imprimir"
    onclick="window.print()"
  >
    Imprimir / Guardar PDF
  </button>


  <h2 class="seccion">
    Últimos gastos
  </h2>


  <div id="lista"></div>

</div>


<script>

var SUPABASE_URL =
  "https://jzguybdxiilpglyiqzqq.supabase.co";

var SUPABASE_KEY =
  "sb_publishable_znJR0UdAV3tuY4pW-oILXw_XRN9_-vI";


function ponerEstado(texto, tipo) {

  var elemento =
    document.getElementById("estado");

  elemento.textContent =
    texto || "";

  elemento.className =
    "estado";

  if (tipo === "ok") {
    elemento.className =
      "estado ok";
  }

  if (tipo === "error") {
    elemento.className =
      "estado error";
  }
}


function fechaHoy() {

  var ahora =
    new Date();

  var anio =
    ahora.getFullYear();

  var mes =
    String(
      ahora.getMonth() + 1
    ).padStart(2, "0");

  var dia =
    String(
      ahora.getDate()
    ).padStart(2, "0");

  return (
    anio +
    "-" +
    mes +
    "-" +
    dia
  );
}


function inicioMesActual() {

  var ahora =
    new Date();

  var anio =
    ahora.getFullYear();

  var mes =
    String(
      ahora.getMonth() + 1
    ).padStart(2, "0");

  return (
    anio +
    "-" +
    mes +
    "-01"
  );
}


function inicioMesSiguiente() {

  var ahora =
    new Date();

  var siguiente =
    new Date(
      ahora.getFullYear(),
      ahora.getMonth() + 1,
      1
    );

  var anio =
    siguiente.getFullYear();

  var mes =
    String(
      siguiente.getMonth() + 1
    ).padStart(2, "0");

  return (
    anio +
    "-" +
    mes +
    "-01"
  );
}


function dinero(valor) {

  return Number(valor).toLocaleString(
    "es-AR",
    {
      style: "currency",
      currency: "ARS",
      maximumFractionDigits: 0
    }
  );
}


function urlBaseGastos() {

  return (
    SUPABASE_URL +
    "/rest/v1/gastos?apikey=" +
    encodeURIComponent(
      SUPABASE_KEY
    )
  );
}


async function cargarGastos() {

  ponerEstado(
    "Actualizando gastos..."
  );

  var desde =
    inicioMesActual();

  var hasta =
    inicioMesSiguiente();


  var url =
    urlBaseGastos() +
    "&select=*" +
    "&fecha=gte." +
    encodeURIComponent(desde) +
    "&fecha=lt." +
    encodeURIComponent(hasta) +
    "&order=fecha.desc,created_at.desc";


  try {

    var respuesta =
      await fetch(
        url,
        {
          method: "GET",
          mode: "cors",
          cache: "no-store"
        }
      );


    if (!respuesta.ok) {

      var errorTexto =
        await respuesta.text();

      console.error(
        "Supabase GET",
        respuesta.status,
        errorTexto
      );

      ponerEstado(
        "Error al cargar: " +
        respuesta.status,
        "error"
      );

      return;
    }


    var gastos =
      await respuesta.json();


    mostrarGastos(
      gastos
    );


    ponerEstado("");

  }
  catch (error) {

    console.error(
      "Error GET:",
      error
    );

    ponerEstado(
      "Error de conexión al cargar",
      "error"
    );
  }
}


async function guardarGasto() {

  var boton =
    document.getElementById("guardar");


  var monto =
    Number(
      document.getElementById(
        "monto"
      ).value
    );


  var fecha =
    document.getElementById(
      "fecha"
    ).value;


  var categoria =
    document.getElementById(
      "categoria"
    ).value;


  var detalle =
    document.getElementById(
      "detalle"
    ).value.trim();


  var persona =
    document.getElementById(
      "persona"
    ).value;


  if (
    !monto ||
    monto <= 0
  ) {

    alert(
      "Ingresá un monto válido"
    );

    return;
  }


  if (!fecha) {

    alert(
      "Elegí una fecha"
    );

    return;
  }


  var gasto = {

    fecha: fecha,

    monto: monto,

    categoria: categoria,

    detalle:
      detalle === ""
      ? null
      : detalle,

    persona: persona
  };


  boton.disabled =
    true;

  boton.textContent =
    "Guardando...";


  ponerEstado(
    "Guardando gasto..."
  );


  try {

    var url =
      urlBaseGastos();


    var respuesta =
      await fetch(
        url,
        {
          method: "POST",

          mode: "cors",

          headers: {
            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"
          },

          body:
            JSON.stringify(
              gasto
            )
        }
      );


    if (!respuesta.ok) {

      var errorTexto =
        await respuesta.text();


      console.error(
        "Supabase POST",
        respuesta.status,
        errorTexto
      );


      ponerEstado(
        "Error al guardar: " +
        respuesta.status,
        "error"
      );


      alert(
        "No se pudo guardar. Error " +
        respuesta.status
      );


      return;
    }


    document.getElementById(
      "monto"
    ).value = "";


    document.getElementById(
      "detalle"
    ).value = "";


    document.getElementById(
      "fecha"
    ).value =
      fechaHoy();


    ponerEstado(
      "Gasto guardado correctamente",
      "ok"
    );


    await cargarGastos();

  }
  catch (error) {

    console.error(
      "Error POST:",
      error
    );


    ponerEstado(
      "Error de conexión al guardar",
      "error"
    );


    alert(
      "No se pudo conectar con Supabase"
    );

  }
  finally {

    boton.disabled =
      false;

    boton.textContent =
      "Guardar gasto";
  }
}


function mostrarGastos(gastos) {

  var lista =
    document.getElementById(
      "lista"
    );


  lista.innerHTML =
    "";


  var total =
    0;


  if (
    !gastos ||
    gastos.length === 0
  ) {

    document.getElementById(
      "total"
    ).textContent =
      "$0";


    lista.innerHTML =
      '<div class="vacio">Todavía no hay gastos cargados este mes.</div>';


    return;
  }


  for (
    var i = 0;
    i < gastos.length;
    i++
  ) {

    var gasto =
      gastos[i];


    total +=
      Number(
        gasto.monto
      );


    var partes =
      String(
        gasto.fecha
      ).split("-");


    var fechaVisible =
      partes[2] +
      "/" +
      partes[1] +
      "/" +
      partes[0];


    var fila =
      document.createElement(
        "div"
      );


    fila.className =
      "gasto";


    var izquierda =
      document.createElement(
        "div"
      );


    var categoria =
      document.createElement(
        "div"
      );


    categoria.className =
      "categoria";


    categoria.textContent =
      gasto.categoria ||
      "";


    izquierda.appendChild(
      categoria
    );


    if (gasto.detalle) {

      var detalle =
        document.createElement(
          "div"
        );


      detalle.className =
        "detalle";


      detalle.textContent =
        gasto.detalle;


      izquierda.appendChild(
        detalle
      );
    }


    var info =
      document.createElement(
        "div"
      );


    info.className =
      "info";


    info.textContent =
      fechaVisible +
      " · " +
      (
        gasto.persona ||
        ""
      );


    izquierda.appendChild(
      info
    );


    var importe =
      document.createElement(
        "div"
      );


    importe.className =
      "importe";


    importe.textContent =
      dinero(
        gasto.monto
      );


    fila.appendChild(
      izquierda
    );


    fila.appendChild(
      importe
    );


    lista.appendChild(
      fila
    );
  }


  document.getElementById(
    "total"
  ).textContent =
    dinero(total);
}


document.getElementById(
  "fecha"
).value =
  fechaHoy();


document.getElementById(
  "guardar"
).addEventListener(
  "click",
  guardarGasto
);


cargarGastos();

</script>

</body>
</html>
