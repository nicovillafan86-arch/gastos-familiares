<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>Gastos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    .app {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 22px;
    }

    h1 {
      font-size: 38px;
      margin: 18px 0 22px;
    }

    .tarjeta {
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .titulo-total {
      color: #777;
      font-size: 18px;
    }

    #total {
      margin: 8px 0 0;
      font-size: 38px;
    }

    input,
    select {
      display: block;
      width: 100%;
      min-height: 56px;
      margin-bottom: 13px;
      padding: 0 15px;
      border: 1px solid #d8d8d8;
      border-radius: 12px;
      background: #fff;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 17px;
    }

    #monto {
      font-size: 25px;
      font-weight: bold;
    }

    input[type="date"] {
      -webkit-appearance: none;
      appearance: none;
      min-height: 56px;
      color: #222;
      background: #fff;
    }

    button {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #guardar {
      background: #222;
      color: #fff;
    }

    #guardar:disabled {
      opacity: 0.5;
    }

    .imprimir {
      background: #686868;
      color: #fff;
      margin-bottom: 28px;
    }

    .estado {
      min-height: 22px;
      text-align: center;
      font-size: 14px;
      color: #666;
      margin: 4px 0 15px;
    }

    .estado.ok {
      color: #197039;
      font-weight: bold;
    }

    .estado.error {
      color: #b00020;
      font-weight: bold;
    }

    h2.seccion {
      font-size: 25px;
      margin: 10px 0 16px;
    }

    .gasto {
      background: #fff;
      border-radius: 13px;
      padding: 16px;
      margin-bottom: 9px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
    }

    .categoria {
      font-size: 17px;
      font-weight: bold;
    }

    .detalle {
      margin-top: 4px;
      font-size: 15px;
    }

    .info {
      margin-top: 6px;
      color: #777;
      font-size: 14px;
    }

    .importe {
      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;
    }

    .vacio {
      text-align: center;
      color: #888;
      padding: 30px 10px;
    }

    @media print {
      body {
        background: #fff;
      }

      .formulario,
      .imprimir,
      .estado {
        display: none !important;
      }

      .app {
        max-width: 100%;
        padding: 0;
      }

      .tarjeta,
      .gasto {
        border: 1px solid #ddd;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Gastos</h1>

  <div class="tarjeta">
    <div class="titulo-total">
      Gastado este mes
    </div>

    <h2 id="total">$0</h2>
  </div>


  <div class="tarjeta formulario">

    <input
      id="monto"
      type="number"
      inputmode="decimal"
      min="0"
      step="0.01"
      placeholder="$ Monto"
    >

    <input
      id="fecha"
      type="date"
    >

    <select id="categoria">
      <option value="Supermercado">Supermercado</option>
      <option value="Comida">Comida</option>
      <option value="Combustible">Combustible</option>
      <option value="Chicos">Chicos</option>
      <option value="Salidas">Salidas</option>
      <option value="Compras">Compras</option>
      <option value="Casa">Casa</option>
      <option value="Otros">Otros</option>
    </select>

    <input
      id="detalle"
      type="text"
      placeholder="Detalle (opcional)"
    >

    <select id="persona">
      <option value="Nico">Nico</option>
      <option value="Mica">Mica</option>
    </select>

    <button
      id="guardar"
      type="button"
    >
      Guardar gasto
    </button>

  </div>


  <div
    id="estado"
    class="estado"
  ></div>


  <button
    type="button"
    class="imprimir"
    onclick="window.print()"
  >
    Imprimir / Guardar PDF
  </button>


  <h2 class="seccion">
    Últimos gastos
  </h2>

  <div id="lista"></div>

</div>


<script>

const SUPABASE_URL =
  "https://jzguybdxiilpglyiqzqq.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_znJR0UdAV3tuY4pW-oILXw_XRN9_-vI";


function headers(extra) {

  return Object.assign(
    {
      "apikey": SUPABASE_KEY,
      "Accept": "application/json"
    },
    extra || {}
  );
}


function ponerEstado(texto, tipo) {

  const elemento =
    document.getElementById("estado");

  elemento.textContent =
    texto || "";

  elemento.className =
    "estado";

  if (tipo) {
    elemento.classList.add(tipo);
  }
}


function fechaHoy() {

  const fecha =
    new Date();

  const anio =
    fecha.getFullYear();

  const mes =
    String(
      fecha.getMonth() + 1
    ).padStart(2, "0");

  const dia =
    String(
      fecha.getDate()
    ).padStart(2, "0");

  return (
    anio +
    "-" +
    mes +
    "-" +
    dia
  );
}


function inicioMes() {

  const fecha =
    new Date();

  const anio =
    fecha.getFullYear();

  const mes =
    String(
      fecha.getMonth() + 1
    ).padStart(2, "0");

  return (
    anio +
    "-" +
    mes +
    "-01"
  );
}


function inicioMesSiguiente() {

  const ahora =
    new Date();

  const fecha =
    new Date(
      ahora.getFullYear(),
      ahora.getMonth() + 1,
      1
    );

  const anio =
    fecha.getFullYear();

  const mes =
    String(
      fecha.getMonth() + 1
    ).padStart(2, "0");

  return (
    anio +
    "-" +
    mes +
    "-01"
  );
}


function dinero(valor) {

  return Number(valor).toLocaleString(
    "es-AR",
    {
      style: "currency",
      currency: "ARS",
      maximumFractionDigits: 0
    }
  );
}


async function cargarGastos() {

  ponerEstado(
    "Actualizando gastos..."
  );


  const desde =
    inicioMes();

  const hasta =
    inicioMesSiguiente();


  const url =
    SUPABASE_URL +
    "/rest/v1/gastos" +
    "?select=*" +
    "&fecha=gte." +
    encodeURIComponent(desde) +
    "&fecha=lt." +
    encodeURIComponent(hasta) +
    "&order=fecha.desc,created_at.desc";


  try {

    const respuesta =
      await fetch(
        url,
        {
          method: "GET",

          headers:
            headers(),

          cache:
            "no-store"
        }
      );


    if (!respuesta.ok) {

      const error =
        await respuesta.text();


      console.error(
        "ERROR GET:",
        respuesta.status,
        error
      );


      ponerEstado(
        "Error al cargar: " +
        respuesta.status,
        "error"
      );


      return;
    }


    const gastos =
      await respuesta.json();


    mostrarGastos(
      gastos
    );


    ponerEstado("");

  }

  catch (error) {

    console.error(
      "ERROR CONEXION GET:",
      error
    );


    ponerEstado(
      "Error de conexión al cargar",
      "error"
    );
  }
}


async function guardarGasto() {

  const boton =
    document.getElementById(
      "guardar"
    );


  const monto =
    Number(
      document.getElementById(
        "monto"
      ).value
    );


  const fecha =
    document.getElementById(
      "fecha"
    ).value;


  const categoria =
    document.getElementById(
      "categoria"
    ).value;


  const detalle =
    document.getElementById(
      "detalle"
    ).value.trim();


  const persona =
    document.getElementById(
      "persona"
    ).value;


  if (
    !Number.isFinite(monto) ||
    monto <= 0
  ) {

    alert(
      "Ingresá un monto válido"
    );

    return;
  }


  if (!fecha) {

    alert(
      "Elegí una fecha"
    );

    return;
  }


  const nuevoGasto = {

    fecha:
      fecha,

    monto:
      monto,

    categoria:
      categoria,

    detalle:
      detalle === ""
        ? null
        : detalle,

    persona:
      persona
  };


  boton.disabled =
    true;


  boton.textContent =
    "Guardando...";


  ponerEstado(
    "Guardando gasto..."
  );


  try {

    const respuesta =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/gastos",

        {
          method:
            "POST",

          headers:
            headers(
              {
                "Content-Type":
                  "application/json",

                "Prefer":
                  "return=representation"
              }
            ),

          body:
            JSON.stringify(
              nuevoGasto
            )
        }
      );


    if (!respuesta.ok) {

      const error =
        await respuesta.text();


      console.error(
        "ERROR POST:",
        respuesta.status,
        error
      );


      ponerEstado(
        "Error al guardar: " +
        respuesta.status,
        "error"
      );


      alert(
        "No se pudo guardar. Error " +
        respuesta.status
      );


      return;
    }


    document.getElementById(
      "monto"
    ).value =
      "";


    document.getElementById(
      "detalle"
    ).value =
      "";


    document.getElementById(
      "fecha"
    ).value =
      fechaHoy();


    await cargarGastos();


    ponerEstado(
      "Gasto guardado correctamente",
      "ok"
    );

  }

  catch (error) {

    console.error(
      "ERROR CONEXION POST:",
      error
    );


    ponerEstado(
      "Error de conexión al guardar",
      "error"
    );


    alert(
      "No se pudo conectar con Supabase"
    );

  }

  finally {

    boton.disabled =
      false;


    boton.textContent =
      "Guardar gasto";
  }
}


function mostrarGastos(gastos) {

  const lista =
    document.getElementById(
      "lista"
    );


  lista.innerHTML =
    "";


  if (
    !Array.isArray(gastos) ||
    gastos.length === 0
  ) {

    document.getElementById(
      "total"
    ).textContent =
      "$0";


    lista.innerHTML =
      '<div class="vacio">' +
      'Todavía no hay gastos cargados este mes.' +
      '</div>';


    return;
  }


  let total =
    0;


  gastos.forEach(
    function(gasto) {

      total +=
        Number(
          gasto.monto
        ) || 0;


      const partes =
        String(
          gasto.fecha
        ).split("-");


      const fechaVisible =
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0];


      const fila =
        document.createElement(
          "div"
        );


      fila.className =
        "gasto";


      const izquierda =
        document.createElement(
          "div"
        );


      const categoria =
        document.createElement(
          "div"
        );


      categoria.className =
        "categoria";


      categoria.textContent =
        gasto.categoria || "";


      izquierda.appendChild(
        categoria
      );


      if (gasto.detalle) {

        const detalle =
          document.createElement(
            "div"
          );


        detalle.className =
          "detalle";


        detalle.textContent =
          gasto.detalle;


        izquierda.appendChild(
          detalle
        );
      }


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "info";


      info.textContent =
        fechaVisible +
        " · " +
        (
          gasto.persona ||
          ""
        );


      izquierda.appendChild(
        info
      );


      const importe =
        document.createElement(
          "div"
        );


      importe.className =
        "importe";


      importe.textContent =
        dinero(
          gasto.monto
        );


      fila.appendChild(
        izquierda
      );


      fila.appendChild(
        importe
      );


      lista.appendChild(
        fila
      );
    }
  );


  document.getElementById(
    "total"
  ).textContent =
    dinero(total);
}


document.getElementById(
  "fecha"
).value =
  fechaHoy();


document.getElementById(
  "guardar"
).addEventListener(
  "click",
  guardarGasto
);


cargarGastos();

</script>

</body>
</html>
