<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Gastos</title>

  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-top: 15px;
      margin-bottom: 5px;
      font-size: 36px;
    }

    .mes {
      color: #777;
      margin-bottom: 20px;
      text-transform: capitalize;
    }

    .total,
    .formulario {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 18px;
    }

    .total span {
      color: #777;
      font-size: 17px;
    }

    .total h2 {
      font-size: 32px;
      margin: 8px 0 0;
    }

    input,
    select {
      width: 100%;
      height: 54px;
      padding: 0 14px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
      color: #222;
      font-size: 16px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .monto {
      font-size: 24px;
      font-weight: bold;
    }

    input[type="date"] {
      -webkit-appearance: none;
      appearance: none;
      background: white;
      color: #222;
      min-height: 54px;
    }

    input[type="date"]::-webkit-date-and-time-value {
      text-align: left;
      color: #222;
    }

    button {
      width: 100%;
      min-height: 54px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
    }

    .btn-imprimir {
      background: #6d6d6d;
      margin-bottom: 25px;
    }

    h3 {
      font-size: 22px;
    }

    .estado {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin: 10px 0 18px;
      min-height: 18px;
    }

    .error {
      color: #b00020;
    }

    .gasto {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    .categoria {
      font-weight: bold;
      font-size: 17px;
    }

    .detalle {
      margin-top: 4px;
      font-size: 15px;
    }

    .info {
      color: #777;
      font-size: 14px;
      margin-top: 6px;
    }

    .importe {
      font-size: 18px;
      font-weight: bold;
      white-space: nowrap;
    }

    .vacio {
      text-align: center;
      color: #888;
      padding: 25px;
    }

    @media print {
      body {
        background: white;
      }

      .formulario,
      .btn-imprimir,
      .estado {
        display: none !important;
      }

      .app {
        max-width: 100%;
        padding: 0;
      }

      .total,
      .gasto {
        border: 1px solid #ddd;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Gastos</h1>
  <div class="mes" id="mes"></div>

  <div class="total">
    <span>Gastado este mes</span>
    <h2 id="total">$0</h2>
  </div>

  <div class="formulario">

    <input
      id="monto"
      class="monto"
      type="number"
      inputmode="decimal"
      placeholder="$ Monto"
    >

    <input
      id="fecha"
      type="date"
    >

    <select id="categoria">
      <option value="Supermercado">Supermercado</option>
      <option value="Comida">Comida</option>
      <option value="Combustible">Combustible</option>
      <option value="Chicos">Chicos</option>
      <option value="Salidas">Salidas</option>
      <option value="Compras">Compras</option>
      <option value="Casa">Casa</option>
      <option value="Otros">Otros</option>
    </select>

    <input
      id="detalle"
      type="text"
      placeholder="Detalle (opcional)"
    >

    <select id="persona">
      <option value="Nico">Nico</option>
      <option value="Mica">Mica</option>
    </select>

    <button id="btnGuardar" type="button">
      Guardar gasto
    </button>

  </div>

  <div id="estado" class="estado"></div>

  <button
    class="btn-imprimir"
    type="button"
    onclick="window.print()"
  >
    Imprimir / Guardar PDF
  </button>

  <h3>Últimos gastos</h3>

  <div id="lista"></div>

</div>

<script>

  const SUPABASE_URL =
    "https://jzguybdxiilpglyiqzqq.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_znJR0UdAV3tuY4pW-oILXw_XRN9_-vI";


  let gastos = [];


  function headersSupabase() {
    return {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    };
  }


  function fechaHoy() {
    const hoy = new Date();

    const anio = hoy.getFullYear();
    const mes = String(hoy.getMonth() + 1).padStart(2, "0");
    const dia = String(hoy.getDate()).padStart(2, "0");

    return ${anio}-${mes}-${dia};
  }


  function inicioMesActual() {
    const hoy = new Date();

    const anio = hoy.getFullYear();
    const mes = String(hoy.getMonth() + 1).padStart(2, "0");

    return ${anio}-${mes}-01;
  }


  function inicioMesSiguiente() {
    const hoy = new Date();

    const siguiente = new Date(
      hoy.getFullYear(),
      hoy.getMonth() + 1,
      1
    );

    const anio = siguiente.getFullYear();
    const mes = String(siguiente.getMonth() + 1).padStart(2, "0");

    return ${anio}-${mes}-01;
  }


  function formatearDinero(valor) {
    return Number(valor).toLocaleString(
      "es-AR",
      {
        style: "currency",
        currency: "ARS",
        maximumFractionDigits: 0
      }
    );
  }


  function mostrarEstado(texto, error = false) {
    const estado = document.getElementById("estado");

    estado.textContent = texto;
    estado.className = error
      ? "estado error"
      : "estado";
  }


  async function cargarGastos() {

    mostrarEstado("Actualizando gastos...");

    try {

      const desde = inicioMesActual();
      const hasta = inicioMesSiguiente();

      const url =
        ${SUPABASE_URL}/rest/v1/gastos +
        ?select=* +
        &fecha=gte.${desde} +
        &fecha=lt.${hasta} +
        &order=fecha.desc,created_at.desc;

      const respuesta = await fetch(
        url,
        {
          method: "GET",
          headers: headersSupabase()
        }
      );


      if (!respuesta.ok) {
        const texto = await respuesta.text();

        console.error(texto);

        throw new Error(
          "Error " + respuesta.status
        );
      }


      gastos = await respuesta.json();

      mostrarGastos();

      mostrarEstado("");

    } catch (error) {

      console.error(error);

      mostrarEstado(
        "No se pudieron cargar los gastos.",
        true
      );

    }

  }


  async function guardarGasto() {

    const monto =
      Number(
        document.getElementById("monto").value
      );

    const fecha =
      document.getElementById("fecha").value;

    const categoria =
      document.getElementById("categoria").value;

    const detalle =
      document.getElementById("detalle").value.trim();

    const persona =
      document.getElementById("persona").value;

    const boton =
      document.getElementById("btnGuardar");


    if (!monto || monto <= 0) {
      alert("Ingresá un monto válido");
      return;
    }

    if (!fecha) {
      alert("Seleccioná una fecha");
      return;
    }


    boton.disabled = true;
    boton.textContent = "Guardando...";

    mostrarEstado("Guardando gasto...");


    try {

      const respuesta = await fetch(
        ${SUPABASE_URL}/rest/v1/gastos,
        {
          method: "POST",

          headers: {
            ...headersSupabase(),
            "Prefer": "return=representation"
          },

          body: JSON.stringify({
            monto: monto,
            fecha: fecha,
            categoria: categoria,
            detalle: detalle || null,
            persona: persona
          })
        }
      );


      if (!respuesta.ok) {

        const texto =
          await respuesta.text();

        console.error(texto);

        throw new Error(
          "Error " + respuesta.status
        );

      }


      document.getElementById("monto").value = "";
      document.getElementById("detalle").value = "";
      document.getElementById("fecha").value = fechaHoy();

      await cargarGastos();


    } catch (error) {

      console.error(error);

      alert(
        "No se pudo guardar el gasto."
      );

      mostrarEstado(
        "Error al guardar.",
        true
      );

    } finally {

      boton.disabled = false;
      boton.textContent = "Guardar gasto";

    }

  }


  function mostrarGastos() {

    const lista =
      document.getElementById("lista");


    const total =
      gastos.reduce(
        function(suma, gasto) {
          return suma + Number(gasto.monto);
        },
        0
      );


    document.getElementById("total").textContent =
      formatearDinero(total);


    if (gastos.length === 0) {

      lista.innerHTML =
        '<div class="vacio">' +
        'Todavía no cargaron gastos este mes.' +
        '</div>';

      return;

    }


    lista.innerHTML = "";


    gastos.forEach(
      function(gasto) {

        const contenedor =
          document.createElement("div");

        contenedor.className = "gasto";


        const izquierda =
          document.createElement("div");


        const categoria =
          document.createElement("div");

        categoria.className = "categoria";
        categoria.textContent = gasto.categoria;

        izquierda.appendChild(categoria);


        if (gasto.detalle) {

          const detalle =
            document.createElement("div");

          detalle.className = "detalle";
          detalle.textContent = gasto.detalle;

          izquierda.appendChild(detalle);

        }


        const info =
          document.createElement("div");

        info.className = "info";


        const partesFecha =
          gasto.fecha.split("-");


        const fechaVisible =
          ${partesFecha[2]}/${partesFecha[1]}/${partesFecha[0]};


        info.textContent =
          fechaVisible +
          " · " +
          gasto.persona;


        izquierda.appendChild(info);


        const importe =
          document.createElement("div");

        importe.className = "importe";

        importe.textContent =
          formatearDinero(
            gasto.monto
          );


        contenedor.appendChild(
          izquierda
        );

        contenedor.appendChild(
          importe
        );


        lista.appendChild(
          contenedor
        );

      }
    );

  }


  document.getElementById("fecha").value =
    fechaHoy();


  document.getElementById("mes").textContent =
    new Date().toLocaleDateString(
      "es-AR",
      {
        month: "long",
        year: "numeric"
      }
    );


  document
    .getElementById("btnGuardar")
    .addEventListener(
      "click",
      guardarGasto
    );


  cargarGastos();

</script>

</body>
</html>
